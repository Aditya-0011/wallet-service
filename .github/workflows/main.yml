name: Publish and Deploy Wallet Service Container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/aditya-0011/wallet-service:latest
            ghcr.io/aditya-0011/wallet-service:${{ github.sha }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.PAT_TOKEN }}

      - name: Server Setup & Run Podman
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          script: |
            echo "${{ secrets.PAT_TOKEN }}" | podman login ghcr.io -u aditya-0011 --password-stdin

            podman pull ghcr.io/aditya-0011/wallet-service:latest

            podman stop wallet-service || true
            podman rm wallet-service || true

            podman run -d \
              --name wallet-service \
              --network host \
              --env-file ~/wallet-service-production.conf \
              --restart unless-stopped \
              --memory 1024m \
              --cpus 1 \
              ghcr.io/aditya-0011/wallet-service:latest

            podman image prune -f
